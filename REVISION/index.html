<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meal Explorer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f7f9fb;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    input, select {
      padding: 8px 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #mealContainer {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.03);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-content h3 {
      margin: 0 0 10px 0;
      color: #0088cc;
    }

    .card-content p {
      margin: 5px 0;
      color: #555;
    }

    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
        align-items: center;
      }
      input, select {
        width: 90%;
      }
    }
  </style>
</head>
<body>
  <h1>🍽️ Meal Explorer</h1>

  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search by name or category..." />
    <select id="sortSelect">
      <option value="">Sort By</option>
      <option value="name-asc">Name (A → Z)</option>
      <option value="name-desc">Name (Z → A)</option>
      <option value="area-asc">Area (A → Z)</option>
      <option value="area-desc">Area (Z → A)</option>
    </select>
  </div>

  <div id="mealContainer"></div>

  <script>
    const mealContainer = document.getElementById("mealContainer");
    const searchBox = document.getElementById("searchBox");
    const sortSelect = document.getElementById("sortSelect");

    let mealsData = [];

    async function fetchMeals() {
      try {
        const res = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?f=a");
        const data = await res.json();
        mealsData = data.meals || [];
        displayMeals(mealsData);
      } catch (error) {
        mealContainer.innerHTML = "<p>❌ Failed to load data.</p>";
      }
    }

    function displayMeals(meals) {
      mealContainer.innerHTML = "";
      meals.forEach(meal => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${meal.strMealThumb}" alt="${meal.strMeal}">
          <div class="card-content">
            <h3>${meal.strMeal}</h3>
            <p><strong>Category:</strong> ${meal.strCategory}</p>
            <p><strong>Area:</strong> ${meal.strArea}</p>
          </div>
        `;
        mealContainer.appendChild(card);
      });
    }

    function sortMeals(value) {
      let sorted = [...mealsData];
      if (value === "name-asc") sorted.sort((a, b) => a.strMeal.localeCompare(b.strMeal));
      if (value === "name-desc") sorted.sort((a, b) => b.strMeal.localeCompare(a.strMeal));
      if (value === "area-asc") sorted.sort((a, b) => a.strArea.localeCompare(b.strArea));
      if (value === "area-desc") sorted.sort((a, b) => b.strArea.localeCompare(a.strArea));
      displayMeals(sorted);
    }

    function filterMeals(keyword) {
      const filtered = mealsData.filter(meal =>
        meal.strMeal.toLowerCase().includes(keyword.toLowerCase()) ||
        meal.strCategory.toLowerCase().includes(keyword.toLowerCase())
      );
      displayMeals(filtered);
    }

    searchBox.addEventListener("input", (e) => {
      filterMeals(e.target.value);
    });

    sortSelect.addEventListener("change", (e) => {
      sortMeals(e.target.value);
    });

    fetchMeals();
  </script>
</body>
</html>
